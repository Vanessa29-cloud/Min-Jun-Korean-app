<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeakPingo</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#a78bfa,#f472b6,#fb923c);min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0}
 .app{background:white;width:380px;border-radius:32px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.2);text-align:center}
 .pingo{font-size:80px;animation:bounce 2s infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
 .listening.pingo{animation: none; transform: scale(1.2)}
  h1{margin:10px 0 5px;font-size:22px}
 .scenario{background:#f5f3ff;padding:14px;border-radius:16px;margin:15px 0;font-size:14px;color:#6d28d9}
  #micBtn{width:90px;height:90px;border-radius:50%;border:none;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:white;font-size:36px;cursor:pointer;box-shadow:0 8px 20px rgba(139,92,246,.4);transition:.2s}
  #micBtn.listening{background:#ef4444;animation:pulse 1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}70%{box-shadow:0 0 0 20px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
  #status{margin:12px 0;font-weight:700;color:#8b5cf6;min-height:22px}
  #transcript{background:#f9fafb;border-radius:12px;padding:12px;min-height:50px;text-align:left;font-size:14px;margin-top:12px}
 .score{display:flex;gap:8px;justify-content:center;margin-top:15px}
 .badge{background:#f3f0ff;padding:6px 12px;border-radius:20px;font-size:12px}
  canvas{width:100%;height:40px;margin-top:10px}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="pingo" id="pingo">🟣</div>
  <h1>SpeakPingo</h1>
  <div class="scenario" id="scenario">Scenario: Comfort a friend who feels alone in the darkest time.</div>
  <button id="micBtn">🎤</button>
  <div id="status">Tap mic to speak</div>
  <canvas id="wave"></canvas>
  <div id="transcript">Your words will appear here...</div>
  <div class="score">
    <div class="badge">⭐ XP: <span id="xp">0</span></div>
    <div class="badge">🔥 Streak: <span id="streak">0</span></div>
  </div>
  <div id="feedback" style="margin-top:15px;text-align:left;font-size:13px"></div>
</div>

<script>
let recognition, isListening=false, xp=0, streak=0;
const micBtn=document.getElementById('micBtn');
const statusEl=document.getElementById('status');
const transcriptEl=document.getElementById('transcript');
const feedbackEl=document.getElementById('feedback');
const appEl=document.getElementById('app');
const pingoEl=document.getElementById('pingo');

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SpeechRecognition){
  statusEl.innerText="❌ Use Google Chrome for mic to work";
} else {
  recognition = new SpeechRecognition();
  recognition.lang='en-US';
  recognition.interimResults=true;
  recognition.continuous=false;

  recognition.onstart=()=>{
    isListening=true;
    micBtn.classList.add('listening');
    appEl.classList.add('listening');
    statusEl.innerText="Listening... speak now!";
    pingoEl.innerText="👂";
  };
  recognition.onresult=(e)=>{
    const text = Array.from(e.results).map(r=>r[0].transcript).join('');
    transcriptEl.innerText=text;
  };
  recognition.onerror=(e)=>{
    statusEl.innerText="Mic error: "+e.error+" — Allow mic in address bar 🔒";
    stop();
  };
  recognition.onend=()=>{
    stop();
    const finalText=transcriptEl.innerText;
    if(finalText && finalText!=="Your words will appear here..."){
      giveFeedback(finalText);
    }
  };
}

function stop(){
  isListening=false;
  micBtn.classList.remove('listening');
  appEl.classList.remove('listening');
  pingoEl.innerText="😊";
  statusEl.innerText="Tap mic to speak again";
}

micBtn.onclick=async()=>{
  try{
    await navigator.mediaDevices.getUserMedia({audio:true});
    if(isListening){ recognition.stop(); }
    else { transcriptEl.innerText=""; feedbackEl.innerHTML=""; recognition.start(); }
  } catch(err){
    alert("Please ALLOW microphone. Click the lock icon 🔒 in address bar > Microphone > Allow, then reload.");
  }
};

function giveFeedback(text){
  xp+=10; streak+=1;
  document.getElementById('xp').innerText=xp;
  document.getElementById('streak').innerText=streak;
  pingoEl.innerText="🎉";

  // Simple fun feedback logic
  let better = text;
  if(text.toLowerCase().includes("alone")) better = "I get it, feeling alone is tough, but I'm here for you.";
  else better = "Nice! Try saying it like: '" + text + " — I'm here for you.'";

  feedbackEl.innerHTML = `
    <b style="color:#10b981">✓ Great job!</b><br>
    You said: <i>"${text}"</i><br><br>
    <b>More natural:</b> ${better}<br><br>
    <b>Fluency:</b> ${Math.floor(70+Math.random()*30)}/100 — Keep going!
  `;
  // Pingo speaks back
  const utter = new SpeechSynthesisUtterance("Awesome! You said "+ text.substring(0,60));
  speechSynthesis.speak(utter);
}

// fake waveform
const canvas=document.getElementById('wave'), ctx=canvas.getContext('2d');
function drawWave(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!isListening) return;
  ctx.beginPath(); ctx.strokeStyle="#8b5cf6"; ctx.lineWidth=2;
  for(let x=0;x<canvas.width;x++){
    const y=20+Math.sin(x*0.05+Date.now()*0.01)* (10+Math.random()*10);
    if(x==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  requestAnimationFrame(drawWave);
}
setInterval(drawWave, 16);
</script>
</body>
</html>
