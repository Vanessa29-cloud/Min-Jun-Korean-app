html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;min-height:100vh;padding-bottom:90px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg1);z-index:30}
.ko{font-family:"Noto Sans KR",sans-serif;font-weight:700}
.glass{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px}
.p{padding:16px;margin:12px}
.mut{color:var(--mut);font-weight:700}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:8px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;font-weight:900}
.logo{font-size:22px;background:linear-gradient(90deg,#ff7a18,#af002d 60%,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:var(--pri);color:#fff;font:900 15px Nunito;border:0;border-radius:16px;padding:14px 18px;box-shadow:0 4px 0 var(--pri2);cursor:pointer;letter-spacing:.4px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri2)}
.btn.sec{background:var(--box);color:var(--acc);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.red{background:var(--red);box-shadow:0 4px 0 #b32e2e}
.btn.w{width:100%}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}

nav button{background:none;border:0;color:var(--mut);font:800 11px Nunito;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 7px;border-radius:14px}
nav button span{font-size:22px}
nav button.on{color:var(--acc);background:rgba(124,92,255,.14)}
.hidden{display:none!important}
.sec-h{margin:22px 12px 6px;padding:14px 16px;border-radius:20px;color:#fff;font-weight:900;display:flex;justify-content:space-between;background:linear-gradient(120deg,var(--c1),var(--c2));box-shadow:0 6px 18px rgba(0,0,0,.18)}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0}
.node{width:78px;height:78px;border-radius:50%;border:0;font-size:32px;color:#fff;cursor:pointer;background:#b7bddb;box-shadow:0 7px 0 #8a90b3;position:relative}
.node.done{background:var(--pri);box-shadow:0 7px 0 var(--pri2)}
.node.cur{background:linear-gradient(135deg,#ffb020,#ff6a00);box-shadow:0 7px 0 #b84a00;animation:pulse 1.6s infinite}
.node:active{transform:translateY(5px)}
.nl{font-size:12px;font-weight:800;color:var(--mut);margin-top:6px;text-align:center}
@keyframes pulse{50%{transform:scale(1.09)}}
@keyframes bob{50%{transform:translateY(-8px)}}
.avatar{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,#7c5cff,#ff7ab6);display:grid;place-items:center;font-size:38px;animation:bob 2.6s ease-in-out infinite;flex:none}

.lbar{display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:900}

.prog i{display:block;height:100%;background:linear-gradient(90deg,#58cc02,#b5f23d);border-radius:9px;transition:width .4s}
.lbody{flex:1;overflow:auto;padding:10px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.big{font-size:72px}.kob{font-size:46px}.en{font-size:22px;font-weight:900}
.ft{padding:12px 14px;min-height:76px}
.ft.ok{background:rgba(88,204,2,.25)}.ft.bad{background:rgba(255,75,75,.25)}
.opt{width:100%;text-align:left;background:var(--box);border:2px solid var(--line);border-radius:16px;padding:14px;font:800 17px Nunito;color:var(--tx);box-shadow:0 3px 0 var(--line);cursor:pointer}
.opt.good{border-color:var(--pri);background:rgba(88,204,2,.25)}.opt.no{border-color:var(--red);background:rgba(255,75,75,.2)}
.inp{min-height:62px;width:100%;border-radius:16px;border:2px solid var(--line);background:var(--box);font:700 34px "Noto Sans KR";display:flex;align-items:center;justify-content:center}
.kb{display:flex;flex-direction:column;gap:6px;width:100%}.kb div{display:flex;gap:5px;justify-content:center}
.kb button{flex:1;max-width:38px;height:44px;border-radius:10px;border:0;background:var(--box);color:var(--tx);font:700 19px "Noto Sans KR";box-shadow:0 2px 0 var(--line)}
canvas#dc{width:100%;max-width:320px;aspect-ratio:1;touch-action:none;border-radius:18px;background:var(--box);border:2px dashed var(--line);display:block;margin:10px auto}
.chips{display:flex;gap:6px;overflow:auto;padding-bottom:4px}
.chip{flex:none;width:42px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--box);color:var(--tx);font:700 22px "Noto Sans KR"}.chip.on{background:var(--acc);color:#fff}
.wd{display:inline-block;padding:2px 4px;margin:2px;border-radius:8px;border-bottom:2px dotted var(--acc);font-size:26px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#1d2145;color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;z-index:90;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
#cf{position:fixed;inset:0;pointer-events:none;z-index:80;width:100%;height:100%}
.stat{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line);font-weight:800}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

 ${(k=>`<div class="glass p"><b>🎯 TOPIK I Level 2 roadmap (goal: Dec 2028)</b><div class="prog" style="margin:10px 0"><i style="width:${Math.min(100,k/15)}%"></i></div><div class="mut">${k} of about 1,500 words learned · about ${Math.max(0,Math.ceil((1500-k)/((new Date('2028-12-31')-Date.now())/864e5)*7))} new words per week keeps you on track</div></div>`)(LV.filter(l=>l.n<=S.done).reduce((a,l)=>a+l.v.length,0))}
 <div class="glass p"><b>🏆 Leaderboard</b>${L.map((x,i)=>`<div class="stat" style="${x[0]=='You'?'color:var(--acc)':''}"><span>${i+1}. ${x[0]}</span><span>${x[1]} XP</span></div>`).join('')}</div>
 <div class="glass p"><b>Settings</b><div class="row"><button class="btn sec" onclick="tgl()">🌓 Theme</button><button class="btn sec" onclick="nextVoice()">🗣️ Change voice</button><button class="btn sec" onclick="S.slow=S.slow?0:1;save();toast('Slow audio '+(S.slow?'on':'off'))">🐢 Slow audio</button><button class="btn red" onclick="if(confirm('Reset all progress?')){localStorage.removeItem('minjun5');location.reload()}">Reset</button></div></div>`}
// ---------- TOPIK practice ----------
const TQ=[["저는 친구___ 만나요.","I meet a friend.","를","에","이","는"],["오늘 학교___ 가요.","I go to school today.","에","를","이","와"],["물___ 주세요.","Water, please.","을","에서","도","이에요"],["동생___ 학생이에요.","My sibling is also a student.","도","을","에서","에"],["지금 몇 ___예요?","What time is it now?","시","살","개","명"],["개가 두 ___ 있어요.","There are two dogs.","마리","명","살","시"],["저는 스무 ___이에요.","I am twenty years old.","살","마리","명","시"],["식당___ 밥을 먹어요.","I eat a meal at the restaurant.","에서","를","이","와"],["날씨가 ___. (It is hot)","Weather: hot","더워요","추워요","예뻐요","맛있어요"],["내일 친구를 ___. (meet)","Tomorrow I meet a friend.","만나요","마셔요","읽어요","자요"],["아침에 일찍 ___. (wake up)","I wake up early.","일어나요","닫아요","타요","웃어요"],["김치가 ___. (delicious)","The kimchi is delicious.","맛있어요","싫어요","무서워요","느려요"],["저는 한국 사람___.","I am a Korean person.","이에요","을","에서","도"],["어머니___ 시장에 가요.","Mother goes to the market.","는","를","에서","도"]];
let TS=null;
function topikCard(){return `<div class="glass p" style="display:flex;justify-content:space-between;align-items:center"><div><b>🎯 TOPIK I practice</b><div class="mut" style="font-size:12px">10 listening and reading questions</div></div><button class="btn" onclick="topik()">Start</button></div>`}
function topik(){const pool=LV.slice(0,Math.max(6,S.done)).flatMap(l=>l.v).filter(w=>w.ko.length>1);
 const Ls=sh(pool).slice(0,5).map(w=>({t:'L',w,o:sh([w,...sh(pool.filter(x=>x!=w)).slice(0,3)])})),Rs=sh(TQ).slice(0,5).map(x=>({t:'R',x,o:sh(x.slice(2))}));
 TS={q:sh([...Ls,...Rs]),i:0,ok:0,lock:0};$('#les').classList.remove('hidden');tq()}
function tq(){const s=TS.q[TS.i];TS.lock=0;
 if(!s){const pass=TS.ok>=7;if(pass){S.xp+=TS.ok*3;S.today+=TS.ok*3;S.gems+=5;save();boom(140)}hud();H($('#les'),`<div class="lbody" style="justify-content:center"><div class="big">${pass?'🏆':'📚'}</div><div class="en">TOPIK practice: ${TS.ok}/10</div><div class="mut">${pass?'Strong result! +'+TS.ok*3+' XP':'Aim for 7 out of 10, then try again.'}</div></div><div class="ft"><button class="btn w" onclick="closeL()">Done</button></div>`);return}
 const body=s.t=='L'?`<div class="mut">Listening: what does it mean?</div><button class="btn sec" style="font-size:40px" onclick="say('${s.w.ko}')">🔊</button><button class="btn sec" onclick="say('${s.w.ko}',1)">🐢 Slow</button>`+s.o.map((o,k)=>`<button class="opt" id="t${k}" onclick="ta(${k})">${o.en}</button>`).join(''):`<div class="mut">Reading: choose the best word</div><div class="ko" style="font-size:30px">${s.x[0]}</div><div class="mut">${s.x[1]}</div>`+s.o.map((o,k)=>`<button class="opt ko" id="t${k}" onclick="ta(${k})">${o}</button>`).join('');
 H($('#les'),`<div class="lbar"><button class="btn sec" onclick="closeL()" style="padding:6px 12px">✕</button><div class="prog"><i style="width:${TS.i*10}%"></i></div><span>${TS.i+1}/10</span></div><div class="lbody">${body}</div>`);if(s.t=='L')say(s.w.ko)}
function ta(k){if(TS.lock)return;TS.lock=1;const s=TS.q[TS.i],ok=s.t=='L'?s.o[k]==s.w:s.o[k]==s.x[2];if(ok)TS.ok++;$('#t'+k).classList.add(ok?'good':'no');if(!ok){const c=s.o.findIndex(o=>s.t=='L'?o==s.w:o==s.x[2]);$('#t'+c).classList.add('good')}setTimeout(()=>{TS.i++;tq()},ok?700:1500)}
// ---------- Video call ----------
let CL=null,camS=null;
const SCN=[['Introduce yourself','Greet and introduce yourself: name, country, age, job or school.'],['At the market','Role-play buying food and asking prices.'],['At the restaurant','Role-play ordering food and drinks.'],['My family','Talk about family members and their ages.'],['Free talk','Chat about daily life.'],['At the airport','Role-play checking in: passport, ticket, destination, luggage.'],['Asking directions','Role-play asking where a place is and how to get there.'],['At the hospital','Role-play telling a doctor what hurts and how you feel.'],['Hobbies and weekend','Talk about hobbies, weekend plans and favorite things.'],['TOPIK speaking drill','Ask short TOPIK I style questions one at a time (name, age, family, daily routine, plans), then briefly react to each answer.']];
function callTab(){return `<div class="glass p" style="text-align:center"><div class="avatar" style="margin:0 auto">🧑‍🎓</div><b class="en">Call Min Jun</b><div class="mut" style="font-size:13px;margin:6px 0">Practice speaking like a video call. Min Jun listens, answers in Korean, and corrects your mistakes.</div></div>`+SCN.map((s,i)=>`<div class="glass p" style="display:flex;justify-content:space-between;align-items:center"><b>${s[0]}</b><button class="btn" onclick="startCall(${i})">📹 Call</button></div>`).join('')+`<div class="glass p mut" style="font-size:12px">Needs microphone access (Chrome works best). If the mic or camera is blocked, type Korean instead.</div>`}
async function startCall(i){let sm=null;try{sm=await claude.use('sample')}catch(e){}
 CL={sc:SCN[i],h:[],n:0,sm,t0:Date.now(),busy:0,last:'',known:LV.filter(l=>l.n<=Math.max(S.done,3)).flatMap(l=>l.v.map(w=>w.ko)).slice(-60).join(', ')};
 $('#call').classList.remove('hidden');
 H($('#call'),`<div class="lbar"><b>📹 ${CL.sc[0]}</b><span id="ct" class="mut" style="margin-left:auto">0:00</span></div><div class="lbody" style="justify-content:flex-start"><div class="glass" style="position:relative;width:100%;max-width:420px;padding:18px"><div class="avatar" id="mjav" style="margin:0 auto;width:120px;height:120px;font-size:68px">🧑‍🎓</div><div style="position:absolute;right:10px;top:10px;width:84px;height:112px;border-radius:14px;overflow:hidden;background:#222;display:grid;place-items:center"><video id="cam" autoplay muted playsinline style="width:100%;height:100%;object-fit:cover"></video><span id="camx" style="position:absolute">🙂</span></div></div><div class="glass p" style="margin:0;width:100%;max-width:420px;min-height:130px;text-align:left"><div class="mut" id="sy"></div><div class="ko" style="font-size:24px" id="sk">Connecting…</div><div class="mut" id="sr"></div><div id="se" style="font-weight:800"></div><div id="sf" style="margin-top:6px;color:var(--acc);font-weight:800"></div></div><div class="row"><button class="btn sec" onclick="say(CL.last,1)">🐢 Slow</button><button class="btn sec" onclick="speakCb(CL.last)">🔊 Again</button></div><div style="display:flex;gap:6px;width:100%;max-width:420px"><input id="ti" class="ko" placeholder="Type Korean…" style="flex:1;border-radius:12px;border:2px solid var(--line);padding:8px;background:var(--box);color:var(--tx);font-size:18px"><button class="btn" onclick="sendT()">Send</button></div></div><div class="ft"><div class="row" style="margin:0"><button class="btn" id="mic" style="flex:1" onclick="micTurn()">🎤 Tap and speak</button><button class="btn red" onclick="endCall()">End</button></div></div>`);
 try{camS=await navigator.mediaDevices.getUserMedia({video:true});$('#cam').srcObject=camS;$('#camx').style.display='none'}catch(e){}
 CL.tm=setInterval(()=>{const s=Math.floor((Date.now()-CL.t0)/1000),e=$('#ct');if(e)e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},1000);
 turn('(call started: greet the learner)')}
async function turn(said){if(!CL||CL.busy)return;CL.busy=1;$('#sk').textContent='…';$('#sy').textContent=said[0]=='('?'':'You: '+said;let r=null;
 if(CL.sm){try{r=await CL.sm.json(`You are Min Jun, a kind Korean tutor on a video call with a beginner aiming for TOPIK I level 2. Scenario: ${CL.sc[1]} Use short, simple polite Korean (해요체), preferring words from this list: ${CL.known}. Reply with 1-2 short sentences then one easy question. Reply ONLY as JSON {"ko":"","rom":"romanization","en":"English meaning","fix":"if the learner's last Korean had mistakes, the corrected Korean plus a short English tip, else empty string"}. Conversation so far: ${CL.h.slice(-8).join(' | ')}. Learner just said: ${said}`,{cache:false})}catch(e){r=null}}
 if(!r||!r.ko){const F=[['안녕하세요! 이름이 뭐예요?','annyeonghaseyo! ireumi mwoyeyo?','Hello! What is your name?'],['어느 나라 사람이에요?','eoneu nara saramieyo?','Which country are you from?'],['몇 살이에요?','myeot salieyo?','How old are you?'],['오늘 뭐 먹고 싶어요?','oneul mwo meokgo sipeoyo?','What do you want to eat today?']],f=F[CL.n%F.length];r={ko:f[0],rom:f[1],en:f[2],fix:CL.sm?'':'Tutor AI is unavailable here, so these are practice prompts. Answer them out loud.'}}
 CL.n++;CL.h.push('Learner: '+said,'Min Jun: '+r.ko);CL.last=r.ko;$('#sk').textContent=r.ko;$('#sr').textContent=r.rom||'';$('#se').textContent=r.en||'';$('#sf').textContent=r.fix?'✏️ '+r.fix:'';CL.busy=0;speakCb(r.ko)}
function speakCb(t){try{speechSynthesis.cancel();const u=mkU(t,S.slow),a=$('#mjav');u.onstart=()=>{if(a)a.style.animationDuration='.35s'};u.onend=()=>{if(a)a.style.animationDuration=''};speechSynthesis.speak(u)}catch(e){}}
function micTurn(){if(!CL||CL.busy)return;$('#mic').textContent='🎤 Listening…';listen(t=>{$('#mic').textContent='🎤 Tap and speak';if(t===null){toast('Mic not supported: type instead');return}if(!t){toast('Did not hear anything. Try again');return}turn(t)})}
function sendT(){const e=$('#ti'),t=e.value.trim();if(t){e.value='';turn(t)}}
function endCall(){if(!CL)return;clearInterval(CL.tm);try{camS&&camS.getTracks().forEach(t=>t.stop())}catch(e){}camS=null;try{speechSynthesis.cancel()}catch(e){}const m=Math.max(1,Math.round((Date.now()-CL.t0)/6e4)),n=CL.n;$('#call').classList.add('hidden');if(n>=3){const xp=10+n*3;S.xp+=xp;S.today+=xp;S.gems+=3;save();boom(100);toast('Call done: +'+xp+' XP, '+m+' min speaking')}else toast('Call ended');CL=null;render()}
function tgl(){const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;S.theme=dark?'light':'dark';theme();save()}
render();
</script></body></html>
