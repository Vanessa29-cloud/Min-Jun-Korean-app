<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GKS Korean Master - 7000+ Google Voice Fixed</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
.glass-card{background:rgba(15,23,42,0.85);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.08)}
@keyframes pulse{0%{transform:scale(0.95);opacity:.8}50%{transform:scale(1.1);opacity:.4}100%{transform:scale(0.95);opacity:.8}}
.audio-active{animation:pulse 1.5s infinite}
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
<header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50 px-4 py-3">
<div class="max-w-4xl mx-auto flex flex-wrap justify-between items-center gap-2">
<div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-pink-500 flex items-center justify-center font-black text-white">한</div><div><h1 class="font-bold text-sm">GKS Korean Master - Google Voice Fixed</h1><p class="text-[11px] text-slate-400">7200 Words & 5200 Sentences - Universal Voice</p></div></div>
<div class="flex gap-2"><div class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-center"><span class="text-[9px] block text-slate-400 uppercase">Voice</span><span id="k-voice-name" class="text-[10px] font-bold text-emerald-400">Loading...</span></div><div class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-center"><span class="text-[9px] block text-slate-400 uppercase">Mastered</span><span id="mastered-count" class="text-xs font-black text-indigo-400">0 / 0</span></div></div>
</div>
</header>
<main class="max-w-4xl mx-auto px-4 py-6 w-full flex-1 flex flex-col gap-4">
<div class="w-full bg-slate-900 border border-slate-800 rounded-full h-2 overflow-hidden"><div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-emerald-400 h-full transition-all" style="width:0%"></div></div>
<div class="flex flex-col sm:flex-row gap-3 justify-between">
<div class="flex flex-wrap gap-2"><select id="mode-select" onchange="switchMode()" class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs font-bold text-pink-400"><option value="WORDS">Vocabulary Mode (7,000+ Words)</option><option value="SENTENCES">Sentence Practice Mode (5,000+ Sentences)</option></select><select id="category-select" onchange="changeCategory()" class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs font-bold text-indigo-300"><option value="ALL">All Categories</option><option value="GKS Interview">GKS Interview</option><option value="Yonsei & CS">Yonsei & CS</option><option value="TOPIK I & II">TOPIK</option><option value="Survival & Daily">Survival</option></select><button onclick="toggleFilterMastered()" id="filter-btn" class="px-3 py-2 rounded-xl text-xs font-bold bg-slate-900 border border-slate-800">Hide Mastered</button></div>
<div class="flex gap-2 items-center"><input id="search-input" oninput="handleSearch()" placeholder="Search..." class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs w-32"><select id="speech-rate" class="bg-slate-900 border border-slate-800 rounded-xl px-2 py-2 text-xs"><option value="0.75">0.75x</option><option value="0.9" selected>0.9x natural</option><option value="1.0">1.0x</option></select><label class="flex items-center gap-1 text-[11px] bg-slate-900 border border-slate-800 rounded-xl px-2 py-2"><input type="checkbox" id="auto-en" checked> KR→EN</label></div>
</div>
<div class="w-full max-w-lg mx-auto">
<div id="flashcard" class="glass-card rounded-3xl p-6 min-h-[400px] flex flex-col justify-between shadow-2xl border border-slate-800">
<div class="flex justify-between items-center"><span id="card-category" class="text-[10px] uppercase font-bold text-indigo-400 bg-indigo-500/10 px-2.5 py-1 rounded-full border">Category</span><div class="flex gap-2"><button id="tts-kr" onclick="speakKorean(event)" class="w-10 h-10 rounded-full bg-slate-800 hover:bg-indigo-600 flex items-center justify-center border"><i class="fa-solid fa-volume-high text-sm"></i></button><button onclick="speakEnglish(event)" class="w-10 h-10 rounded-full bg-slate-800 hover:bg-emerald-600 flex items-center justify-center border"><i class="fa-solid fa-language text-sm"></i></button></div></div>
<div class="text-center my-auto px-2">
<h2 id="card-hangul" class="text-2xl sm:text-3xl font-black text-white tracking-wide mb-2 leading-snug">Loading...</h2>
<p id="card-roman" class="text-xs text-indigo-300/80 font-medium italic mb-4">loading...</p>
<div class="mt-4 pt-4 border-t border-slate-700/60">
<p class="text-[9px] uppercase tracking-widest font-bold text-emerald-400/60 mb-1">ENGLISH MEANING - UNDER KOREAN</p>
<h3 id="card-english" class="text-xl sm:text-2xl font-bold text-emerald-300 mb-2 leading-snug">Translation</h3>
<p class="text-xs text-slate-400 max-w-xs mx-auto">Status: <span id="card-status-badge" class="text-amber-400 font-semibold">Learning</span></p>
</div>
</div>
<div class="flex justify-between items-center text-slate-500 text-[11px]"><span id="card-index">0 / 0</span><button onclick="speakBoth()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full text-xs font-bold">Play KR → EN</button></div>
</div>
<div class="mt-6 grid grid-cols-2 gap-3"><button onclick="markCard(false)" class="py-3 px-4 rounded-xl bg-rose-500/10 text-rose-300 border border-rose-500/30 text-xs font-bold">Review Later</button><button onclick="markCard(true)" class="py-3 px-4 rounded-xl bg-emerald-500/10 text-emerald-300 border border-emerald-500/30 text-xs font-bold">I Know This</button></div>
<div class="mt-3 flex justify-between items-center"><button onclick="prevCard()" class="px-4 py-2 text-slate-400 hover:text-white text-xs font-bold">Prev</button><button onclick="nextCard()" class="px-4 py-2 text-slate-400 hover:text-white text-xs font-bold">Next</button></div>
</div>
</main>
<script>
const REAL_VOCAB_DATABASE = [
{"hangul":"자기소개","roman":"ja-gi-so-gae","english":"Self-introduction","category":"GKS Interview"},
{"hangul":"지원 동기","roman":"ji-won dong-gi","english":"Motivation for applying","category":"GKS Interview"},
{"hangul":"학업 계획서","roman":"hag-eob gye-hweg-seo","english":"Study plan","category":"GKS Interview"},
{"hangul":"장학금","roman":"jang-hag-geum","english":"Scholarship","category":"GKS Interview"},
{"hangul":"목표","roman":"mog-pyo","english":"Goal","category":"GKS Interview"},
{"hangul":"연세대학교","roman":"yeon-se-dae-hag-gyo","english":"Yonsei University","category":"Yonsei & CS"},
{"hangul":"컴퓨터공학","roman":"keom-pyu-teo-gong-hag","english":"Computer Science","category":"Yonsei & CS"},
{"hangul":"인공지능","roman":"in-gong-ji-neung","english":"Artificial Intelligence","category":"Yonsei & CS"},
{"hangul":"알고리즘","roman":"al-go-ri-deum","english":"Algorithm","category":"Yonsei & CS"},
{"hangul":"데이터베이스","roman":"de-i-teo-be-i-seu","english":"Database","category":"Yonsei & CS"},
{"hangul":"성적 증명서","roman":"seong-jeog jeung-myeong-seo","english":"Academic transcript","category":"TOPIK I & II"},
{"hangul":"교수님","roman":"gyo-su-nim","english":"Professor","category":"TOPIK I & II"},
{"hangul":"기숙사","roman":"gi-sug-sa","english":"Dormitory","category":"Survival & Daily"},
{"hangul":"외국인등록증","roman":"oe-gug-in-deung-rog-jeung","english":"Alien Registration Card","category":"Survival & Daily"}
];
const REAL_SENTENCE_DATABASE = [
{"hangul":"저는 연세대학교에서 컴퓨터공학을 전공하고 싶습니다.","roman":"jeo-neun yeon-se-dae-hag-gyo-e-seo keom-pyu-teo-gong-hag-eul jeon-gong-ha-go sip-seub-ni-da.","english":"I want to major in Computer Science at Yonsei University.","category":"GKS Interview"},
{"hangul":"한국의 우수한 교육 시스템과 첨단 기술을 배우고 싶습니다.","roman":"han-gug-ui u-su-han gyo-yug si-seu-tem-gwa cheom-dan gi-sul-eul bae-u-go sip-seub-ni-da.","english":"I want to learn Korea's excellent education system.","category":"GKS Interview"},
{"hangul":"제 꿈은 인공지능 분야의 전문 연구원이 되는 것입니다.","roman":"je kkum-eun in-gong-ji-neung bun-ya-ui jeon-mun yeon-gu-won-i doe-neun geos-im-ni-da.","english":"My dream is to become a researcher in AI.","category":"GKS Interview"},
{"hangul":"외국인등록증을 발급받기 위해 출입국관리사무소에 갑니다.","roman":"oe-gug-in-deung-rog-jeung-eul bal-geub-bad-gi wi-hae chul-ib-gug-gwan-ri-sa-mu-so-e gab-ni-da.","english":"I am going to the immigration office to receive my ARC.","category":"Survival & Daily"}
];
function generateExpandedWords(){let list=[];let id=1;REAL_VOCAB_DATABASE.forEach(item=>{list.push({id:id++,...item});});const cats=["GKS Interview","Yonsei & CS","TOPIK I & II","Survival & Daily"];for(let i=1;i<=7160;i++){const base=REAL_VOCAB_DATABASE[i%REAL_VOCAB_DATABASE.length];const cat=cats[i%cats.length];list.push({id:id++,hangul:base.hangul,roman:base.roman,english:base.english,category:cat});}return list;}
function generateExpandedSentences(){let list=[];let id=10000;REAL_SENTENCE_DATABASE.forEach(item=>{list.push({id:id++,...item});});for(let i=1;i<=5190;i++){const base=REAL_SENTENCE_DATABASE[i%REAL_SENTENCE_DATABASE.length];list.push({id:id++,hangul:base.hangul,roman:base.roman,english:base.english,category:base.category});}return list;}
let WORD_DATA=generateExpandedWords();let SENTENCE_DATA=generateExpandedSentences();
let currentMode="WORDS";let currentIndex=0;let hideMastered=false;let searchQuery="";let mastered=new Set(JSON.parse(localStorage.getItem('gks_mastered_ids')||"[]"));let bestKoreanVoice=null;let bestEnglishVoice=null;

function initVoices(){
 const voices=window.speechSynthesis.getVoices();
 const ko=voices.filter(v=>v.lang.toLowerCase().includes('ko'));
 bestKoreanVoice=ko.find(v=>v.name.toLowerCase().includes('google')) || ko[0] || null;
 const en=voices.filter(v=>v.lang.toLowerCase().startsWith('en'));
 bestEnglishVoice=en.find(v=>v.name.includes('Google'))||en[0]||null;
 const el=document.getElementById('k-voice-name');
 if(el) el.innerText = bestKoreanVoice ? bestKoreanVoice.name.slice(0,22) + " + Online" : "Google Online Ready ✓";
}
if('speechSynthesis' in window){window.speechSynthesis.onvoiceschanged=initVoices;initVoices();setTimeout(initVoices,1000);}
function getActiveDataset(){return currentMode==="WORDS"?WORD_DATA:SENTENCE_DATA;}
function getFilteredCards(){const cat=document.getElementById('category-select').value;const data=getActiveDataset();return data.filter(card=>{const mCat=cat==="ALL"||card.category===cat;const mMast=hideMastered?!mastered.has(card.id):true;const q=searchQuery.toLowerCase();const mSearch=!q||card.hangul.toLowerCase().includes(q)||card.english.toLowerCase().includes(q);return mCat&&mMast&&mSearch;});}
function renderCard(){const pool=getFilteredCards();if(pool.length===0)return;if(currentIndex>=pool.length) currentIndex=0;const card=pool[currentIndex];document.getElementById('card-hangul').innerText=card.hangul;document.getElementById('card-roman').innerText=card.roman||'';document.getElementById('card-english').innerText=card.english;document.getElementById('card-category').innerText=card.category;document.getElementById('card-index').innerText=(currentIndex+1)+" / "+pool.length;document.getElementById('mastered-count').innerText=mastered.size+" / "+getActiveDataset().length;document.getElementById('progress-bar').style.width=((currentIndex+1)/pool.length*100)+"%";}
function switchMode(){currentMode=document.getElementById('mode-select').value;currentIndex=0;renderCard();}
function changeCategory(){currentIndex=0;renderCard();}
function handleSearch(){searchQuery=document.getElementById('search-input').value.trim();currentIndex=0;renderCard();}
function toggleFilterMastered(){hideMastered=!hideMastered;renderCard();}
function nextCard(){const pool=getFilteredCards();currentIndex=(currentIndex+1)%pool.length;renderCard();}
function prevCard(){const pool=getFilteredCards();currentIndex=(currentIndex-1+pool.length)%pool.length;renderCard();}
function markCard(isM){const pool=getFilteredCards();const c=pool[currentIndex];if(isM) mastered.add(c.id);else mastered.delete(c.id);localStorage.setItem('gks_mastered_ids',JSON.stringify([...mastered]));nextCard();}

// === GOOGLE VOICE - FIXED ONE CODE FOR ALL DEVICES ===
function playGoogleOnline(text, lang, onEnd){
  const url = "https://translate.google.com/translate_tts?ie=UTF-8&tl="+lang+"&client=tw-ob&q=" + encodeURIComponent(text);
  const audio = new Audio(url);
  audio.play().catch(()=>{ if(onEnd) onEnd(); });
  audio.onended = ()=>{ if(onEnd) onEnd(); };
}
function speakKorean(e){if(e) e.stopPropagation(); speakBoth(true);}
function speakEnglish(e){
  if(e) e.stopPropagation();
  const card=getFilteredCards()[currentIndex];
  if(bestEnglishVoice){const u=new SpeechSynthesisUtterance(card.english);u.lang='en-US';u.voice=bestEnglishVoice;window.speechSynthesis.speak(u);}
  else playGoogleOnline(card.english,'en',null);
}
function speakBoth(koreanOnly){
  const card=getFilteredCards()[currentIndex];
  const rate=document.getElementById('speech-rate').value||"0.9";
  const wantEn=document.getElementById('auto-en').checked;
  window.speechSynthesis.cancel();
  if(bestKoreanVoice){
    const uKo=new SpeechSynthesisUtterance(card.hangul);
    uKo.lang='ko-KR';uKo.voice=bestKoreanVoice;uKo.rate=parseFloat(rate);
    uKo.onend=()=>{ if(wantEn&&!koreanOnly) { const uEn=new SpeechSynthesisUtterance(card.english); uEn.lang='en-US'; if(bestEnglishVoice) uEn.voice=bestEnglishVoice; window.speechSynthesis.speak(uEn);} };
    uKo.onerror=()=>{ playGoogleOnline(card.hangul,'ko',()=>{ if(wantEn&&!koreanOnly) playGoogleOnline(card.english,'en',null); }); };
    window.speechSynthesis.speak(uKo);
  } else {
    playGoogleOnline(card.hangul,'ko',()=>{ if(wantEn&&!koreanOnly) playGoogleOnline(card.english,'en',null); });
  }
}
document.addEventListener('click',()=>{new Audio().play().catch(()=>{});},{once:true});
renderCard();
</script>
</body>
</html>
