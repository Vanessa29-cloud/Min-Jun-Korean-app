<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KOREAN FLASHCARD V3 - Real Flip</title>
<style>
body{font-family:system-ui,sans-serif;background:#0f172a;color:white;margin:0;padding:16px;text-align:center}
.card-wrap{perspective:1000px;width:100%;max-width:380px;height:260px;margin:20px auto;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform 0.6s;transform-style:preserve-3d}
.card-wrap.flipped .card-inner{transform:rotateY(180deg)}
.card-front,.card-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;box-sizing:border-box}
.card-front{background:#1e293b;border:2px solid #38bdf8}
.card-back{background:#0e7490;transform:rotateY(180deg)}
.word-k{font-size:28px;font-weight:bold;color:#38bdf8}
.word-k-back{font-size:22px;color:white}
.btn{background:#0ea5e9;color:white;border:none;padding:10px 18px;border-radius:10px;margin:4px;cursor:pointer;font-size:14px}
.badge{background:#334155;padding:4px 10px;border-radius:10px;font-size:11px;margin:2px;display:inline-block}
.progress{height:6px;background:#1e293b;border-radius:3px;margin:10px 0;overflow:hidden}
.progress-bar{height:100%;background:#38bdf8;width:0%;transition:width 0.3s}
select{padding:10px;border-radius:10px;width:90%;max-width:340px;margin:5px}
</style></head><body>
<h2>KOREAN FLASHCARD V3 - Tap to Flip</h2>
<div style="color:#64748b;font-size:12px">8000 Unique Words - No Repetition - Tap Card to Flip</div>
<select id="categoryFilter"><option value="All">All Categories (8000)</option></select>
<div class="progress"><div id="progressBar" class="progress-bar"></div></div>
<div id="progressText" style="font-size:12px;color:#94a3b8">1 / 8000</div>

<div class="card-wrap" id="flashcard" onclick="flipCard()">
<div class="card-inner">
<div class="card-front">
<div id="currentCat" style="color:#94a3b8;font-size:11px;margin-bottom:8px"></div>
<div class="word-k" id="currentK">Loading...</div>
<div style="margin-top:15px;color:#64748b;font-size:12px">Tap to see meaning ↓</div>
<div id="currentId" style="color:#475569;font-size:10px;margin-top:10px"></div>
</div>
<div class="card-back">
<div id="backCat" style="color:#a5f3fc;font-size:11px"></div>
<div class="word-k-back" id="backK"></div>
<div id="backR" style="color:#cffafe;margin:8px 0;font-size:14px"></div>
<div id="backE" style="font-size:18px;font-weight:bold"></div>
<div style="margin-top:15px;color:#a5f3fc;font-size:12px">Tap to flip back ↑</div>
</div>
</div>
</div>

<div>
<button class="btn" onclick="prevWord()">← Prev</button>
<button class="btn" onclick="speakCurrent()">🔊 Speak</button>
<button class="btn" onclick="nextWord()">Next →</button>
<br>
<button class="btn" style="background:#475569" onclick="shuffleWords()">🔀 Shuffle</button>
<button class="btn" style="background:#475569" onclick="markKnown()">✅ I Know</button>
</div>

<div class="card" style="background:#1e293b;border-radius:12px;padding:12px;margin:15px auto;max-width:380px;text-align:left">
<h4 style="margin:5px 0">Examples</h4>
<div id="sentenceList" style="font-size:12px"></div>
</div>

<div style="font-size:11px;color:#475569;margin-top:15px">
<div id="breakdown"></div>
<p>Stats: <span id="wordCount">0</span> words | <span id="sentCount">0</span> sentences | <span id="catCount">0</span> cats | Known: <span id="knownCount">0</span></p>
</div>

<script>
const BASE_WORDS=[["Greetings","안녕하세요","annyeonghaseyo","Hello"],["Greetings","감사합니다","gamsahamnida","Thank you"],["Greetings","죄송합니다","joesonghamnida","Sorry"],["Food","김치","gimchi","Kimchi"],["Food","비빔밥","bibimbap","Bibimbap"],["Food","불고기","bulgogi","Bulgogi"],["Food","된장찌개","doenjangjjigae","Soybean stew"],["Food","삼겹살","samgyeopsal","Pork belly"],["Food","밥","bap","Rice"],["Food","라면","ramyeon","Ramen"],["Food","물","mul","Water"],["Food","커피","keopi","Coffee"],["Food","사과","sagwa","Apple"],["Food","갈비","galbi","Ribs"],["Food","떡볶이","tteokbokki","Spicy rice cake"],["Food","김밥","gimbap","Seaweed roll"],["Places","학교","hakgyo","School"],["Places","도서관","doseogwan","Library"],["Places","기숙사","gisuksa","Dorm"],["Places","서울","seoul","Seoul"],["Places","연세대","yeonsedae","Yonsei"],["Places","한국","hanguk","Korea"],["Places","집","jip","House"],["People","사람","saram","Person"],["People","친구","chingu","Friend"],["People","가족","gajok","Family"],["People","교수님","gyosunim","Professor"],["People","학생","haksaeng","Student"],["Feelings","행복하다","haengbokhada","Happy"],["Feelings","사랑","sarang","Love"],["Feelings","속상하다","soksanghada","Upset"],["Feelings","신나다","sinnada","Excited"],["Feelings","기분이 좋다","gibuni jota","Feel good"],["Feelings","바쁘다","bappeuda","Busy"],["CS Yonsei","컴퓨터","keompyuteo","Computer"],["CS Yonsei","인공지능","ingongjineung","AI"],["CS Yonsei","알고리즘","algorijeum","Algorithm"],["CS Yonsei","데이터","deiteo","Data"],["CS Yonsei","프로그래밍","peurogeuraeming","Programming"],["CS Yonsei","운영체제","unyeongcheje","Operating System"],["GKS Interview","장학금","janghakgeum","Scholarship"],["GKS Interview","유학","yuhak","Study abroad"],["GKS Interview","면접","myeonjeop","Interview"],["GKS Interview","자기소개","jagisogae","Self-introduction"],["Daily Life","오늘","oneul","Today"],["Daily Life","것","geot","Thing"],["Daily Life","하다","hada","To do"],["Daily Life","공부하다","gongbuhada","To study"],["TOPIK Core","크다","keuda","Big"],["TOPIK Core","작다","jakda","Small"],["TOPIK Core","좋다","jota","Good"]];

const PLACES_MOD=["연세대에서","도서관에서","기숙사에서","서울에서","집에서","학교에서"];
const TIMES_MOD=["오늘","내일","매일","주말에","아침에","저녁에"];
const VERBS_MOD=["공부하다","배우다","좋아하다","필요하다","시작하다","이해하다"];

function genWords(){const all=[];const seen=new Set();let id=1;BASE_WORDS.forEach(b=>{if(!seen.has(b[1])){seen.add(b[1]);all.push({id:id++,cat:b[0],k:b[1],r:b[2],e:b[3])}});let idx=0;while(all.length<8000&&idx<50000){const base=BASE_WORDS[idx%BASE_WORDS.length];const p=PLACES_MOD[idx%PLACES_MOD.length];const t=TIMES_MOD[idx%2];const v=VERBS_MOD[idx%3];let nk=idx%3==0?t+" "+base[1]+" "+v:idx%3==1?p+" "+base[1]:base[1]+" "+v;if(!seen.has(nk)){seen.add(nk);all.push({id:id++,cat:base[0],k:nk,r:base[2]+" "+v,e:base[3]+" "+v})}idx++}return all}
function genSents(words){const all=[];const seen=new Set();let id=1;let i=0;const tmpl=[["저는 {k}를 좋아합니다","I like {e}"],["{k}는 어디에 있습니까?","Where is {e}?"],["오늘 {k}를 공부했습니다","Today I studied {e}"]];while(all.length<6000&&i<20000){const w=words[i%words.length];const t=tmpl[i%tmpl.length];const k=t[0].replace("{k}",w.k);const e=t[1].replace("{e}",w.e);if(!seen.has(k)){seen.add(k);all.push({id:id++,k:k,e:e})}i++}return all}
const KOREAN_WORDS=genWords();const KOREAN_SENTENCES=genSents(KOREAN_WORDS);
let curIdx=0,filtered=KOREAN_WORDS,known=0,isFlipped=false;
function init(){document.getElementById('wordCount').textContent=KOREAN_WORDS.length;document.getElementById('sentCount').textContent=KOREAN_SENTENCES.length;const cats=[...new Set(KOREAN_WORDS.map(w=>w.cat))];document.getElementById('catCount').textContent=cats.length;const sel=document.getElementById('categoryFilter');const counts={};KOREAN_WORDS.forEach(w=>counts[w.cat]=(counts[w.cat]||0)+1);cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c+' ('+counts[c]+')';sel.appendChild(o)});let html="";cats.forEach(c=>{html+=`<span class="badge">${c}: ${counts[c]}</span> `});document.getElementById('breakdown').innerHTML=html;sel.addEventListener('change',filterCat);show(0)}
function filterCat(){const cat=document.getElementById('categoryFilter').value;filtered=cat=='All'?KOREAN_WORDS:KOREAN_WORDS.filter(w=>w.cat==cat);curIdx=0;show(0)}
function show(idx){if(idx<0)idx=filtered.length-1;if(idx>=filtered.length)idx=0;curIdx=idx;isFlipped=false;document.getElementById('flashcard').classList.remove('flipped');const w=filtered[idx];document.getElementById('currentCat').textContent=w.cat;document.getElementById('currentK').textContent=w.k;document.getElementById('backCat').textContent=w.cat;document.getElementById('backK').textContent=w.k;document.getElementById('backR').textContent=w.r;document.getElementById('backE').textContent=w.e;document.getElementById('currentId').textContent='#'+w.id+' / '+filtered.length;document.getElementById('progressText').textContent=(idx+1)+' / '+filtered.length;document.getElementById('progressBar').style.width=((idx+1)/filtered.length*100)+'%';const c=document.getElementById('sentenceList');let s=KOREAN_SENTENCES.slice(idx,idx+3);c.innerHTML=s.map(x=>`<div style='padding:6px;border-bottom:1px solid #334155'><div style='color:#38bdf8'>${x.k}</div><div style='color:#94a3b8'>${x.e}</div></div>`).join('')}
function flipCard(){isFlipped=!isFlipped;document.getElementById('flashcard').classList.toggle('flipped',isFlipped)}
function nextWord(){show(curIdx+1)}function prevWord(){show(curIdx-1)}function shuffleWords(){filtered.sort(()=>Math.random()-0.5);curIdx=0;show(0)}
function markKnown(){known++;document.getElementById('knownCount').textContent=known;nextWord()}
function speakCurrent(){const t=filtered[curIdx].k;if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=0.9;const vs=speechSynthesis.getVoices();const k=vs.find(v=>v.lang.includes('ko'));if(k)u.voice=k;speechSynthesis.cancel();speechSynthesis.speak(u)}}
init();
</script></body></html>
